<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
</head>
{# A short note: the minutes themselves are the attached PDF (minutes_pdf.html). #}
<body style="margin:0;padding:20px 16px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#1f2a37;">
<p style="margin:0 0 14px;">{{ labels.greeting }}</p>
<p style="margin:0 0 14px;">{{ cover }}{% if approved %} {{ approved }}{% endif %}</p>
{% if signed_by %}
<p style="margin:0;">{{ labels.regards }}<br>{{ signed_by }}</p>
{% endif %}
</body>
</html>
